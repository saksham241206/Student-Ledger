<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Ledger — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E4DCC5;
    --paper:#F6F1E3;
    --rule:#D6CAA9;
    --ink:#232A35;
    --ink-soft:#786D56;
    --red:#B5484A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:20px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--paper);
    border-radius:3px;
    box-shadow:0 10px 28px rgba(35,42,53,0.18);
    padding:32px 28px;
  }
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:none;
    border:none;
    border-bottom:1px solid var(--ink-soft);
    padding:8px 2px;
    margin-bottom:20px;
  }
  input:focus{outline:none;border-bottom:1.5px solid var(--ink);}
  button{
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{opacity:0.88;}
  button:disabled{opacity:0.6;cursor:default;}
  .error{
    color:var(--red);
    font-size:13px;
    margin:-10px 0 16px;
    min-height:16px;
  }
  button:focus-visible, input:focus-visible{
    outline:2px solid var(--red);
    outline-offset:2px;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <p class="eyebrow">Student ledger</p>
    <h1>Sign in</h1>
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <p class="error" id="errorMsg"></p>
    <button type="submit" id="submitBtn">Sign in</button>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'Incorrect username or password.';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch (e) {
        errorEl.textContent = 'Something went wrong. Try again.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
